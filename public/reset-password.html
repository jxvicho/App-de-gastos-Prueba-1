<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastia · Nueva contraseña</title>
<style>
  :root{
    --navy:#0b2545;
    --blue-900:#0e2f5a;
    --blue-800:#123a6b;
    --blue-700:#164b8a;
    --blue-600:#1a5da8;
    --blue-500:#2472c8;
    --blue-400:#5b93d3;
    --blue-200:#c3daf3;
    --blue-100:#eaf2fb;
    --ink:#101828;
    --ink-soft:#5b6675;
    --ink-faint:#8b96a5;
    --line:#e3e9f1;
    --bg:#f4f7fb;
    --card:#ffffff;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Inter","Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none !important;}

  .auth-view{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(circle at 15% 20%, var(--blue-100) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, var(--blue-100) 0%, transparent 45%),
      var(--bg);
  }

  .auth-card{
    width:100%;max-width:380px;background:var(--card);
    border:1px solid var(--line);border-radius:20px;padding:36px 32px;
    box-shadow:0 20px 50px -25px rgba(11,37,69,.25);
  }
  .auth-card h1{
    font-size:24px;margin:0 0 8px 0;
    color:var(--blue-700);
    letter-spacing:.2px;
  }
  .auth-sub{color:var(--ink-soft);font-size:13.5px;line-height:1.55;margin:0 0 22px;}
  .auth-form{display:flex;flex-direction:column;gap:13px;}
  .auth-form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .auth-form input{
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-size:14px;font-family:inherit;transition:border-color .15s ease, box-shadow .15s ease;
  }
  .auth-form input:focus{
    outline:none;border-color:var(--blue-500);
    box-shadow:0 0 0 3px rgba(36,114,200,.15);
  }
  .auth-pw-field{position:relative;display:flex;}
  .auth-pw-field input{flex:1;padding-right:38px;}
  .auth-pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:transparent;cursor:pointer;padding:6px;font-size:16px;line-height:1;color:var(--ink-soft);user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  .auth-pw-toggle:hover{color:var(--ink);}

  .auth-btn{
    border:none;background:var(--blue-700);color:#fff;padding:11px;border-radius:10px;
    font-size:14px;font-weight:700;cursor:pointer;margin-top:2px;
    transition:background .15s ease, transform .1s ease;
  }
  .auth-btn:hover:not(:disabled){background:var(--blue-600);}
  .auth-btn:active:not(:disabled){transform:scale(.98);}
  .auth-btn:disabled{background:var(--ink-faint);cursor:not-allowed;}

  .auth-error{color:#c0392b;font-size:12.5px;margin:12px 0 0;}
  .auth-switch{text-align:center;font-size:13px;color:var(--ink-soft);margin:18px 0 0;}
  .auth-switch a{color:var(--blue-700);font-weight:700;text-decoration:none;}
  .auth-switch a:hover{text-decoration:underline;}
</style>
</head>
<body>

<section class="auth-view">
  <div class="auth-card">
    <div id="resetFormWrap">
      <h1>Gastia</h1>
      <p class="auth-sub">Crea tu nueva contraseña.</p>
      <form id="formReset" class="auth-form">
        <label>Nueva contraseña
          <div class="auth-pw-field">
            <input type="password" name="password" id="pw1" required minlength="8" placeholder="Mínimo 8 caracteres">
            <button type="button" class="auth-pw-toggle" aria-label="Mantén presionado para mostrar la contraseña">👁</button>
          </div>
        </label>
        <label>Confirmar contraseña
          <div class="auth-pw-field">
            <input type="password" name="password2" id="pw2" required minlength="8" placeholder="Repite la contraseña">
            <button type="button" class="auth-pw-toggle" aria-label="Mantén presionado para mostrar la contraseña">👁</button>
          </div>
        </label>
        <button type="submit" class="auth-btn" id="resetSubmitBtn">Guardar nueva contraseña</button>
      </form>
      <p id="authError" class="auth-error" hidden></p>
    </div>

    <div id="noTokenWrap" hidden>
      <h1>Gastia</h1>
      <p class="auth-sub">Este enlace no es válido o ya expiró. Solicita uno nuevo para restablecer tu contraseña.</p>
      <p class="auth-switch"><a href="/recuperar">Pedir un nuevo enlace</a></p>
    </div>
  </div>
</section>

<script>
const API_BASE = "/api";
const token = new URLSearchParams(location.search).get("token");

if (!token) {
  document.getElementById("resetFormWrap").hidden = true;
  document.getElementById("noTokenWrap").hidden = false;
}

async function api(path, options = {}) {
  const res = await fetch(API_BASE + path, {
    ...options,
    headers: { "Content-Type": "application/json", ...options.headers },
  });
  let data = {};
  try { data = await res.json(); }
  catch { throw new Error(`Respuesta inesperada del servidor (código ${res.status})`); }
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

function showAuthError(msg) {
  const el = document.getElementById("authError");
  el.textContent = msg;
  el.hidden = false;
}

document.querySelectorAll(".auth-pw-toggle").forEach(btn=>{
  const input = btn.previousElementSibling;
  const reveal = ()=>{ input.type = "text"; };
  const hide = ()=>{ input.type = "password"; };
  btn.addEventListener("mousedown", reveal);
  btn.addEventListener("touchstart", (e)=>{ e.preventDefault(); reveal(); }, { passive:false });
  btn.addEventListener("mouseup", hide);
  btn.addEventListener("mouseleave", hide);
  btn.addEventListener("touchend", hide);
  btn.addEventListener("touchcancel", hide);
  btn.addEventListener("click", (e)=> e.preventDefault());
});

document.getElementById("formReset").addEventListener("submit", async (e)=>{
  e.preventDefault();
  document.getElementById("authError").hidden = true;

  const pw1 = document.getElementById("pw1").value;
  const pw2 = document.getElementById("pw2").value;
  if (pw1 !== pw2) {
    showAuthError("Las contraseñas no coinciden.");
    return;
  }

  const btn = document.getElementById("resetSubmitBtn");
  btn.disabled = true;
  try {
    const data = await api("/auth/reset-password", {
      method:"POST",
      body: JSON.stringify({ token, password: pw1 }),
    });
    localStorage.setItem("token", data.token);
    localStorage.setItem("user", JSON.stringify(data.user));
    location.href = "/";
  } catch(err) {
    showAuthError(err.message);
    btn.disabled = false;
  }
});
</script>
</body>
</html>
