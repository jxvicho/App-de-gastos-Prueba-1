services:
  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro de Docker, el backend debe apuntar a los nombres de servicio
      # ("postgres", "redis"), no a "localhost". Sobreescribimos aquí lo que
      # venga en tu .env para que funcione sin que tengas que editarlo.
      DATABASE_URL: "postgresql://app:app_password@postgres:5432/gastos_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      # Docker Desktop (Windows/WSL2) a veces tiene rutas IPv6 inestables, lo
      # que provoca errores intermitentes "network_error" de MSAL al hablar
      # con login.microsoftonline.com. Forzamos a Node a preferir IPv4.
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    ports:
      - "4000:4000"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./public:/app/public
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: gastos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
